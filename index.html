<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c2b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snowball">
<title>Snowball</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="safe"></div>
<canvas id="game" width="180" height="320"></canvas>
<script src="./game.js"></script>
<script>
  // Offline support + update detection (service workers need http/https, not file://)
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    // A controller change that happens when the page already had a controller means a new version took over
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController) window.dispatchEvent(new Event('snowball-update'));
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        var check = function () { reg.update().catch(function () {}); };
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
        setInterval(check, 30 * 60 * 1000);
      }).catch(function () {});
    });
  }
</script>
</body>
</html>
